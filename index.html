<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Lock In</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🍅</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet" />
    <style>
      :root { --bg: #e9f1eb; --ink: #14241a; --mute: #52665a; --ac: #1f7a4d; --on: #fff; --line: #14241a33; color-scheme: light dark; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0f1a14; --ink: #e6f1e9; --mute: #9db3a4; --ac: #5fd08f; --on: #08130c; --line: #e6f1e933; }
      }
      body[data-heat="1"] { --bg: #f2e6b8; --ink: #2a2208; --mute: #6b5a1f; --ac: #8a5a00; --on: #fff; --line: #2a220833; }
      body[data-heat="2"] { --bg: #f0c48a; --ink: #2e1804; --mute: #6e4515; --ac: #a33d00; --on: #fff; --line: #2e180433; }
      body[data-heat="3"] { --bg: #d9482b; --ink: #fff3ea; --mute: #ffd7c4; --ac: #fff3ea; --on: #8e1b16; --line: #fff3ea66; }
      body[data-heat="4"] { --bg: #6e0f0c; --ink: #fff3ea; --mute: #f5b8a8; --ac: #ffd23f; --on: #3a0806; --line: #fff3ea66; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 17px/1.5 "Bricolage Grotesque", system-ui, sans-serif; transition: background 0.8s, color 0.8s; }
      main,
      header { max-width: 680px; margin: 0 auto; padding: 0 20px; }
      header { display: flex; justify-content: space-between; align-items: center; padding-top: 22px; padding-bottom: 10px; }
      main { padding-bottom: 140px; }
      .logo { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em; }
      nav { display: flex; gap: 4px; }
      button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
      nav button { padding: 0.3em 0.8em; border-radius: 999px; }
      [aria-pressed="true"] { background: var(--ink); color: var(--bg); }
      .btn { background: var(--ac); color: var(--on); padding: 0.7em 1.4em; border-radius: 999px; font-weight: 700; }
      .ghost { border: 1.5px solid var(--line); padding: 0.55em 1.1em; border-radius: 999px; }
      :focus-visible { outline: 3px solid var(--ac); outline-offset: 3px; }
      h1 { font-size: clamp(2rem, 7vw, 3.3rem); line-height: 1.02; font-weight: 800; letter-spacing: -0.03em; margin: 1.2rem 0 0.6rem; }
      h2 { font-size: 1.3rem; margin: 2rem 0 0.4rem; }
      p { margin: 0.5rem 0; }
      .mute { color: var(--mute); }
      .row { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0; align-items: center; }
      label { display: block; color: var(--mute); font-size: 0.9rem; }
      .chk { display: flex; gap: 10px; align-items: flex-start; color: var(--ink); margin: 10px 0; }
      .chk input { margin-top: 0.4em; accent-color: var(--ac); }
      input[type="text"],
      input[type="number"] { font: inherit; color: var(--ink); background: transparent; border: 0; border-bottom: 2px solid var(--line); padding: 0.4em 0; width: 100%; border-radius: 0; }
      input[type="text"] { font-size: 1.25rem; }
      input[type="number"] { width: 7.5rem; font-size: 1.2rem; }
      .time { font-size: clamp(5.5rem, 25vw, 12rem); font-weight: 800; line-height: 0.95; letter-spacing: -0.05em; font-variant-numeric: tabular-nums; margin: 0.3rem 0 0.6rem; }
      .say { font-size: 1.4rem; font-weight: 600; line-height: 1.2; min-height: 2.4em; }
      body[data-heat="4"] .time { animation: sh 0.35s infinite; }
      @keyframes sh {
        25% { transform: translate(3px, -2px) rotate(0.5deg); }
        75% { transform: translate(-3px, 2px) rotate(-0.5deg); }
      }
      .sum { margin-top: 2rem; padding-top: 1rem; border-top: 1.5px solid var(--line); }
      .r { display: flex; justify-content: space-between; gap: 12px; padding: 0.55em 0; border-bottom: 1px solid var(--line); }
      .r button { padding: 0 0.6em; }
      .spark { font-size: 1.8rem; letter-spacing: 0.08em; }
      .bar2 { flex: 1; height: 10px; align-self: center; background: var(--line); border-radius: 9px; overflow: hidden; }
      .bar2 i { display: block; height: 100%; background: var(--ac); }
      .cf { position: fixed; top: -14px; width: 8px; height: 14px; z-index: 9; animation: fall 2.4s linear forwards; }
      @keyframes fall {
        to { transform: translateY(110vh) rotate(720deg); }
      }
      .heat { display: grid; grid-template-rows: repeat(7, 14px); grid-auto-flow: column; grid-auto-columns: 14px; gap: 3px; overflow-x: auto; padding: 4px 0; }
      .heat i { border-radius: 3px; background: var(--ac); }
      html[data-theme="dark"] body[data-heat="0"] { --bg: #0f1a14; --ink: #e6f1e9; --mute: #9db3a4; --ac: #5fd08f; --on: #08130c; --line: #e6f1e933; }
      html[data-theme="light"] body[data-heat="0"] { --bg: #e9f1eb; --ink: #14241a; --mute: #52665a; --ac: #1f7a4d; --on: #fff; --line: #14241a33; }
      .prog { height: 6px; background: var(--line); border-radius: 6px; overflow: hidden; margin: 6px 0 14px; }
      .prog i { display: block; height: 100%; width: 0; background: var(--ac); }
      body.zen header { display: none; }
      .check { position: fixed; left: 0; right: 0; bottom: 0; background: var(--ink); color: var(--bg); padding: 20px 20px calc(22px + env(safe-area-inset-bottom)); }
      .check > div { max-width: 680px; margin: 0 auto; }
      .check .q { font-size: 1.5rem; font-weight: 700; line-height: 1.15; margin: 0; }
      .check .btn { background: var(--bg); color: var(--ink); }
      .bar { height: 4px; background: currentColor; margin-top: 6px; opacity: 0.6; }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; transition: none !important; }
        .cf { display: none; }
      }
      .hrs { display: flex; align-items: flex-end; gap: 3px; height: 80px; margin: 10px 0; }
      .hrs i { flex: 1; background: var(--ac); min-height: 2px; border-radius: 2px; }
      .breath { width: 80px; height: 80px; border-radius: 50%; background: var(--ac); margin: 36px auto; animation: br 8s ease-in-out infinite; }
      @keyframes br {
        50% { transform: scale(1.7); }
      }
    </style>
  </head>
  <body data-heat="0">
    <header>
      <span class="logo">Lock In</span>
      <nav>
        <button data-act="tab" data-v="timer">Timer</button><button data-act="tab" data-v="stats">Stats</button><button data-act="tab" data-v="todo">To-do</button
        ><button data-act="theme" aria-label="Switch theme">◐</button>
      </nav>
    </header>
    <main id="app"></main>
    <div id="chk" aria-live="assertive"></div>
    <script>
      const KEY = "lockin.v1",
        $ = (s) => document.querySelector(s);
      const D = {
        set: {
          mode: "normal",
          tabwatch: false,
          noise: false,
          auto: true,
          theme: "auto",
          wgoal: 120,
          hard: false,
          notify: false,
          w: 25,
          b: 5,
          goal: 4,
          task: "",
        },
        st: {
          blocks: 0,
          clean: 0,
          streak: 0,
          best: 0,
          slacks: 0,
          min: 0,
          dayStreak: 0,
          bestDay: 0,
          lastDay: "",
          today: "",
          todayN: 0,
        },
        badges: [],
        hist: [],
        moods: [],
        todos: [],
        days: {},
        roasts: [],
        tasks: {},
        presets: [],
      };
      function load() {
        try {
          const r = JSON.parse(localStorage.getItem(KEY));
          if (r)
            return {
              ...structuredClone(D),
              ...r,
              set: { ...D.set, ...r.set },
              st: { ...D.st, ...r.st },
            };
        } catch {}
        return structuredClone(D);
      }
      function save() {
        try {
          localStorage.setItem(KEY, JSON.stringify(DB));
        } catch {}
      }
      let DB = load(),
        S = { phase: "idle" },
        V = "timer",
        AC;
      const MODES = {
        gentle: { base: 8, shrink: 0.85, ans: 90, off: 0, cap: 2 },
        normal: { base: 5, shrink: 0.6, ans: 60, off: 0, cap: 4 },
        drill: { base: 3, shrink: 0.5, ans: 40, off: 2, cap: 4 },
      };
      const M = {
        check: ["You’ve got this! Still working? 💪", "Hey, just checking in. Still on task?", "Are you ACTUALLY working right now?", "Hello?? Are you working or not?!", "ARE YOU WORKING?!"],
        yes: ["That’s what I like to see. Keep it up! 🔥", "Good. Stay locked in.", "Okay, I believe you… for now. 👀", "Hmm. Prove it with results.", "FINE. NOW KEEP GOING."],
        no: [
          "No worries, breathe and get back to it. You can do it! 🌱",
          "Close the other tab and get back to work.",
          "Seriously? Put the phone down.",
          "COME ON, LOCK IN!! 😤",
          "LOCK. IN. NOW. YOUR FUTURE SELF IS WATCHING. 😡",
        ],
        ign: [
          "No answer? I’ll count that as a no. You can do it though! 🌱",
          "Silence? Suspicious. Back to work.",
          "You ignored me?! Get back to work!",
          "I SAW THAT. LOCK IN!!",
          "STOP IGNORING ME AND LOCK IN!!!",
        ],
      };
      const BADGES = {
        first: "First pomodoro",
        hat: "Hat trick: 3 clean blocks in a row",
        unstop: "Unstoppable: 10 clean blocks in a row",
        marathon: "Marathoner: a clean block of 50+ minutes",
        owl: "Night owl: finished a block between midnight and 5am",
        goal: "Goal getter: hit your daily goal",
        hard: "Hardcore: a clean block in hardcore mode",
        week: "Week warrior: 7 days in a row",
        ten: "Getting started: 10 pomodoros",
        century: "Centurion: 100 pomodoros",
        hours: "Ten hours: 600 focus minutes",
        mood10: "Self-aware: logged 10 moods",
      };
      const TIPS = [
        "Put your phone in another room.",
        "Write down the one thing you want finished by the end of this block.",
        "Close every tab you don’t need.",
        "Drink some water first.",
        "Start with the hardest part.",
        "Jot down distracting thoughts and keep going.",
      ];
      const RANKS = [
        [0, "Distracted Rookie"],
        [60, "Warming Up"],
        [300, "Focused Apprentice"],
        [1000, "Lock-In Specialist"],
        [3000, "Deep Work Master"],
        [6000, "Pomodoro Legend"],
      ];
      const rank = (m) => RANKS.filter((r) => m >= r[0]).pop()[1];
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const ymd = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      const lv = () => Math.max(0, Math.min(S.nag + MODES[S.mode].off, MODES[S.mode].cap)),
        pick = (k) => ((k == "no" || k == "ign") && DB.roasts.length && Math.random() < 0.35 ? DB.roasts[(Math.random() * DB.roasts.length) | 0] : M[k][lv()]);
      const delay = () => {
        const m = MODES[S.mode];
        return Math.max(30, m.base * m.shrink ** S.nag * 60) * 1000 * (0.8 + Math.random() * 0.4);
      };
      const dayStreak = () => {
        const s = DB.st,
          n = new Date();
        return [ymd(n), ymd(new Date(n - 864e5))].includes(s.lastDay) ? s.dayStreak : 0;
      };

      function audio() {
        try {
          AC = AC || new AudioContext();
        } catch {}
      }
      function ping(t, b, f = 660) {
        if (!DB.set.notify) return;
        try {
          if (AC) {
            AC.resume();
            const o = AC.createOscillator(),
              g = AC.createGain();
            o.frequency.value = f;
            g.gain.value = 0.08;
            o.connect(g);
            g.connect(AC.destination);
            o.start();
            o.stop(AC.currentTime + 0.25);
          }
          if (Notification.permission === "granted") new Notification(t, { body: b });
        } catch {}
      }

      function record(min, sl, hard) {
        const s = DB.st,
          n = new Date(),
          day = ymd(n),
          old = rank(s.min);
        if (s.lastDay !== day) {
          s.dayStreak = s.lastDay === ymd(new Date(n - 864e5)) ? s.dayStreak + 1 : 1;
          s.lastDay = day;
          s.bestDay = Math.max(s.bestDay, s.dayStreak);
        }
        if (s.today !== day) {
          s.today = day;
          s.todayN = 0;
        }
        s.todayN++;
        s.blocks++;
        s.min += min;
        s.slacks += sl;
        DB.days[day] = (DB.days[day] || 0) + min;
        DB.tasks[S.task] = (DB.tasks[S.task] || 0) + min;
        if (!sl) {
          s.clean++;
          s.streak++;
          s.best = Math.max(s.best, s.streak);
        } else s.streak = 0;
        DB.hist = [...DB.hist, { day, task: S.task, min, sl }].slice(-10);
        const got = [],
          give = (k) => {
            if (!DB.badges.includes(k)) {
              DB.badges.push(k);
              got.push(k);
            }
          };
        give("first");
        if (s.streak >= 3) give("hat");
        if (s.streak >= 10) give("unstop");
        if (min >= 50 && !sl) give("marathon");
        if (n.getHours() < 5) give("owl");
        if (DB.set.goal && s.todayN >= DB.set.goal) give("goal");
        if (hard && !sl) give("hard");
        if (s.dayStreak >= 7) give("week");
        if (s.blocks >= 10) give("ten");
        if (s.blocks >= 100) give("century");
        if (s.min >= 600) give("hours");
        save();
        return {
          streak: s.streak,
          n: s.todayN,
          rankUp: rank(s.min) !== old ? rank(s.min) : null,
          got,
          slacked: sl,
          score: Math.max(0, 100 - sl * 20),
          mood: null,
          hour: n.getHours(),
          day,
          task: S.task,
        };
      }

      function start() {
        const w = +$("#w").value,
          b = +$("#b").value;
        if (!(w > 0 && b > 0)) {
          $("#err").textContent = "Work and break each need to be more than 0 minutes.";
          return;
        }
        Object.assign(DB.set, { w, b, task: $("#task").value.trim() });
        save();
        audio();
        S = {
          phase: "work",
          mode: DB.set.mode,
          hard: DB.set.hard,
          task: DB.set.task || "your work",
          w,
          b,
          cycles: 0,
        };
        beginWork();
      }
      function beginWork() {
        const n = Date.now();
        Object.assign(S, {
          phase: "work",
          nag: 0,
          slacked: 0,
          snoozes: S.hard ? 0 : 2,
          pauseUsed: false,
          paused: false,
          checking: null,
          sum: null,
          half: 0,
          five: 0,
          say: "Tip: " + TIPS[(Math.random() * TIPS.length) | 0],
          endsAt: n + S.w * 6e4,
        });
        S.nextCheck = n + delay();
        noise(true);
        go();
      }
      function finishWork() {
        noise(false);
        S.checking = null;
        S.cycles++;
        S.sum = record(S.w, S.slacked, S.hard);
        if (S.sum.got.length || (DB.set.goal && S.sum.n == DB.set.goal)) confetti();
        const long = S.cycles % 4 == 0;
        S.phase = "break";
        S.cur = long ? S.b * 3 : S.b;
        S.endsAt = Date.now() + S.cur * 6e4;
        S.say = "Break idea: " + BR[(Math.random() * BR.length) | 0];
        ping("Work block done!", long ? "Long break. You earned it." : "Break time.", 880);
        go();
      }
      function finishBreak() {
        ping("Break’s over", "Back to it!");
        if (DB.set.auto === false) {
          S.phase = "ready";
          S.checking = null;
          go();
        } else beginWork();
      }
      function openCheck() {
        const t = Math.max(15, MODES[S.mode].ans - S.nag * 10);
        S.checking = {
          dl: Date.now() + t * 1e3,
          tot: t * 1e3,
          q: pick("check"),
          snz: S.snoozes > 0,
        };
        ping("Still working?", S.checking.q);
        go();
      }
      function answer(v) {
        const n = Date.now();
        S.checking = null;
        if (v == "yes") {
          S.say = pick("yes");
          S.nag = Math.max(0, S.nag - 1);
          S.nextCheck = n + delay();
        } else if (v == "snooze") {
          S.snoozes--;
          S.say = "Fine… 5 more minutes. (" + S.snoozes + " snooze(s) left.)";
          S.nextCheck = n + 3e5;
        } else {
          S.say = pick(v == "no" ? "no" : "ign");
          S.slacked++;
          S.nag++;
          S.nextCheck = n + delay();
        }
        go();
      }
      function pause() {
        if (S.hard || S.pauseUsed || S.checking) return;
        S.paused = true;
        S.pauseUsed = true;
        S.pausedAt = Date.now();
        go();
      }
      function resume() {
        const g = Date.now() - S.pausedAt;
        S.endsAt += g;
        S.nextCheck += g;
        S.paused = false;
        go();
      }
      function stop() {
        if (S.hard && S.phase == "work") {
          if (!confirm("Quitting mid-block in hardcore mode resets your streak. Quit anyway?")) return;
          DB.st.streak = 0;
          save();
        }
        document.body.classList.remove("zen");
        noise(false);
        S = { phase: "idle" };
        document.title = "Lock In";
        go();
      }
      function tick() {
        if (S.phase == "idle" || S.phase == "ready") return;
        const n = Date.now();
        if (S.paused) {
          if (n - S.pausedAt > 6e5) resume();
          return paint();
        }
        if (n >= S.endsAt) return S.phase == "work" ? finishWork() : finishBreak();
        if (S.checking && n >= S.checking.dl) answer("ign");
        else if (S.phase == "work" && !S.checking && n >= S.nextCheck && S.nextCheck < S.endsAt) openCheck();
        if (S.phase == "work" && !S.checking) {
          const l = S.endsAt - n,
            t = S.w * 6e4;
          if (!S.half && t >= 6e5 && l <= t / 2) {
            S.half = 1;
            S.say = "Halfway there! Keep that momentum going.";
            ping("Halfway", "Keep going!");
            go();
          } else if (!S.five && t >= 9e5 && l <= 3e5) {
            S.five = 1;
            S.say = "5 minutes left. Finish strong!";
            ping("5 minutes left", "Finish strong!");
            go();
          }
        }
        paint();
      }

      const vSetup =
        () => `<h1>What are you locking in on?</h1><p class="mute">I’ll check in while you work. Admit you’re slacking, or ignore me, and I get louder.</p><p class="mute">Today: ${DB.st.today == ymd(new Date()) ? DB.st.todayN : 0}/${DB.set.goal} pomodoros. Day streak: ${dayStreak()}.</p>
<input id="task" type="text" maxlength="80" placeholder="Write the intro paragraph" value="${esc(DB.set.task)}" aria-label="Task">
<div class="row">${[[15, 3], [25, 5], [50, 10], [90, 20], ...DB.presets].map((p) => `<button class="ghost" data-act="preset" data-w="${p[0]}" data-b="${p[1]}">${p[0]} / ${p[1]} min</button>`).join("")}</div>
<div class="row"><label>Work minutes<input id="w" type="number" min="0.1" step="any" value="${DB.set.w}"></label><label>Break minutes<input id="b" type="number" min="0.1" step="any" value="${DB.set.b}"></label><button class="ghost" data-act="savepre">Save these times</button></div>
<p>How loud should I get?</p><div class="row">${["gentle", "normal", "drill"].map((m) => `<button class="ghost" data-act="mode" data-v="${m}" aria-pressed="${DB.set.mode == m}">${m[0].toUpperCase() + m.slice(1)}</button>`).join("")}</div>
<label class="chk"><input type="checkbox" data-act="hard" ${DB.set.hard ? "checked" : ""}>Hardcore: no snooze, no pause, and quitting resets your streak.</label>
<label class="chk"><input type="checkbox" data-act="notify" ${DB.set.notify ? "checked" : ""}>Play a sound and send a browser notification at check-ins.</label>
<label class="chk"><input type="checkbox" data-act="auto" ${DB.set.auto !== false ? "checked" : ""}>Start the next block automatically after each break.</label>
<label class="chk"><input type="checkbox" data-act="noise" ${DB.set.noise ? "checked" : ""}>Play soft brown noise while I work.</label>
<label class="chk"><input type="checkbox" data-act="tabw" ${DB.set.tabwatch ? "checked" : ""}>Tab watch: leaving this tab for more than 30 seconds counts as slacking.</label>
<p id="err" role="alert"></p><div class="row"><button class="btn" data-act="start">Start focus block</button></div>
<h2>How it works</h2><p>Start a block and I’ll check in at random times. Say you’re working and I calm down. Say no, or ignore me, and I check in more often and get louder. Finish a block without slacking to grow your streak, earn badges, and climb the ranks.</p>`;
      const vSum = () => {
        const m = S.sum;

          const hrs = DB.hours || {},
            mx = Math.max(1, ...Object.values(hrs));
          const dist = Object.entries(DB.distractions || {}).sort((x, y) => y[1] - x[1]);
          h = `<h2>Rank progress</h2><p>${rk[1]}${nx ? " → " + nx[1] : ""}</p><div class="bar2" style="display:block"><i style="width:${pct}%"></i></div>
      <h2>Focus by hour</h2><div class="hrs" aria-hidden="true">${[...Array(24)].map((_, i) => `<i style="height:${((hrs[i] || 0) / mx) * 100}%"></i>`).join("")}</div>
      <p class="mute">Midnight on the left, 11 PM on the right. Taller bars mean more focus.</p>
      <h2>What distracts you</h2>${dist.length ? dist.map((x) => `<div class="r"><span>${esc(x[0])}</span><b>${x[1]}</b></div>`).join("") : '<p class="mute">Log distractions during a block to see your patterns.</p>'}
      <div class="row"><button class="ghost" data-act="csv">Download history (CSV)</button></div>`;
        } else if (V == "timer" && S.phase == "idle") {
          const c = chToday();
          h = `<h2>Today’s challenge</h2><p>${c.t}${DB.chDone == tdy() ? " ✅" : ""}</p><div class="bar2" style="display:block;margin:8px 0"><i style="width:${Math.min(1, c.f()) * 100}%"></i></div><p class="mute">${c.s()}</p>
      <h2>Thought for the day</h2><p>${QUOTES[[...tdy()].reduce((x, y) => x + y.charCodeAt(0), 0) % QUOTES.length]}</p>`;
        } else if (V == "timer" && S.phase == "work") {
          h = `<h2>Got distracted?</h2><p class="mute">Tell me what pulled you away. It counts as slacking, and I’ll remember.</p>
      <div class="row">${DISTRACTIONS.map((d) => `<button class="ghost" data-act="distract" data-v="${d}">${d}</button>`).join("")}</div>`;
        } else if (V == "timer" && S.phase == "break") {
          h = `<div class="breath" aria-hidden="true"></div><p class="mute">Breathe in as the circle grows and out as it shrinks.</p>`;
        }
        if (h) a.insertAdjacentHTML("beforeend", `<div data-x>${h}</div>`);
      }
      new MutationObserver(extras).observe($("#app"), { childList: true });
      extras();
    </script>
  </body>
</html>
